name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core workspace
        run: npm run build --workspace=@preptex/core

      - name: Verify source, types, tests, and TSDoc
        run: npm run check

      - name: Build all workspaces
        run: npm run build

      - name: Verify generated API reference is current
        run: |
          npm run docs
          git diff --exit-code -- docs/api

      - name: Inspect publishable core package
        run: npm run pack:check
